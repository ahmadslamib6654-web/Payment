<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الدفع</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f3f6f9;margin:0;padding:20px;box-sizing:border-box}
        .container{max-width:420px;margin:30px auto}
        .card{padding:20px;border-radius:12px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
        h1{text-align:center;margin-bottom:20px}
        .summary p{margin:8px 0;font-size:16px}
        button{width:100%;padding:12px;background:#0b61c2;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px}
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>ملخص الدفع</h1>
            <div class="summary">
                <p><strong>الاسم الكامل:</strong> <span id="summaryName"></span></p>
                <p><strong>نوع الهوية:</strong> <span id="summaryIdType"></span></p>
                <p><strong>تاريخ الميلاد:</strong> <span id="summaryBirth"></span></p>
                <p><strong>رقم الجوال:</strong> <span id="summaryPhone"></span></p>
                <p><strong>البريد الإلكتروني:</strong> <span id="summaryEmail"></span></p>
                <p><strong>المبلغ المطلوب:</strong> <span id="summaryAmount"></span></p>
            </div>
            <button id="payBtn">ادفع الآن</button>
        </div>
    </div>

<script>
    // استرجاع البيانات من sessionStorage
    const data = JSON.parse(sessionStorage.getItem('taxPaymentData'));

    if(data){
        document.getElementById('summaryName').innerText = data.fullName;
        document.getElementById('summaryIdType').innerText = data.idType;
        document.getElementById('summaryBirth').innerText = data.birth;
        document.getElementById('summaryPhone').innerText = data.phone;
        document.getElementById('summaryEmail').innerText = data.email;
        document.getElementById('summaryAmount').innerText = data.amount;
    } else {
        alert('لم يتم العثور على بيانات الدفع. الرجاء العودة للنموذج.');
        window.location.href = 'index.html'; // يرجع للموديل
    }

    // زر الدفع (تجريبي)
    document.getElementById('payBtn').addEventListener('click', function(){
        alert('هنا سيتم تحويل المستخدم لبوابة الدفع (تجريبي).');
        // هنا ممكن تضع رابط بوابة الدفع الحقيقية أو عملية الدفع
    });
</script>
</body>
</html>
