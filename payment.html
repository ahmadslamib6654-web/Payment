<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بوابة الدفع الآمنة</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: Arial; direction: rtl; background:#f5f5f5; margin:0; padding:0; }
    header, footer { background:#004080; color:white; text-align:center; padding:20px 0; }
    main { padding:20px; }
    form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    input { width:100%; padding:8px; margin-top:5px; box-sizing:border-box; }
    button { margin-top:20px; padding:10px; width:100%; background:#004080; color:white; border:none; border-radius:4px; font-size:16px; }
  </style>
</head>
<body>

<header>
  <h2>بوابة الدفع الآمنة</h2>
</header>

<main>
  <form id="paymentForm">
    <label for="confirmBooking">تأكيد رقم الحجز (6 أرقام):</label>
    <input type="text" id="confirmBooking" required minlength="6" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
    <button type="submit">ادفع الآن</button>
  </form>
</main>

<footer>
  جميع الحقوق محفوظة © 2025
</footer>

<script>
const stripe = Stripe("pk_test_XXXXXXXXXXXXXXXXXXXX"); // ضع هنا مفتاح Stripe العام

document.getElementById("paymentForm").addEventListener("submit", async e => {
  e.preventDefault();
  const booking = document.getElementById("confirmBooking").value;
  if (booking.length !== 6) { alert("رقم الحجز يجب أن يتكون من 6 أرقام"); return; }

  const response = await fetch("/create-checkout-session", {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ bookingNumber: booking })
  });

  const session = await response.json();
  const result = await stripe.redirectToCheckout({ sessionId: session.id });
  if(result.error) alert(result.error.message);
});
</script>

</body>
</html>
